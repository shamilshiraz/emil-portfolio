<div aria-hidden="true" aria-labelledby="ctH" aria-modal="true" class="ct" id="ct" role="dialog">
<div class="ct-back" data-ct-close=""></div>
<div class="ct-panel" id="ctPanel" tabindex="-1">
<div class="ct-top">
<span class="ct-mono">[Contact]</span>
<button class="ct-x ct-mono" data-ct-close="" type="button">Close ×</button>
</div>
<h2 id="ctH">Say hello.</h2>
<p class="ct-lede">A good idea, an interesting problem, or just a conversation that goes somewhere unexpected. Write to me here.</p>
<form class="ct-form" id="ctForm" novalidate="">
<label class="ct-f"><span class="ct-mono">[Your name]</span><input autocomplete="name" maxlength="120" name="name" placeholder="Jane Doe" required="" type="text"/></label>
<label class="ct-f"><span class="ct-mono">[Your email]</span><input autocomplete="email" inputmode="email" maxlength="160" name="email" placeholder="jane@example.com" required="" type="email"/></label>
<label class="ct-f"><span class="ct-mono">[Message]</span><textarea maxlength="4000" name="message" placeholder="What's on your mind?" required="" rows="5"></textarea></label>
<label aria-hidden="true" class="ct-hp">Leave this empty<input autocomplete="off" name="website" tabindex="-1" type="text"/></label>
<div class="ct-foot">
<button class="ct-send" id="ctSend" type="submit">Send message →</button>
<p aria-live="polite" class="ct-status ct-mono" id="ctStatus" role="status"></p>
</div>
</form>
<div aria-live="polite" class="ct-done" id="ctDone">
<h2>Thank you.</h2>
<p id="ctDoneText"></p>
<button class="ct-x ct-mono" data-ct-close="" type="button">Close ×</button>
</div>
</div>
</div>
